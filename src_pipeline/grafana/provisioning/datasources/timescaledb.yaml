apiVersion: 1

datasources:
  - name: TimescaleDB
    uid: timescaledb
    type: postgres
    access: proxy
    url: timescaledb:5432
    user: $POSTGRES_USER
    secureJsonData:
      password: $POSTGRES_PASSWORD
    jsonData:
      # Grafana läser databasnamnet härifrån, inte från det gamla database-fältet.
      # Utan den här raden hittar panelerna ingen data i webbläsaren.
      database: $POSTGRES_DB
      sslmode: disable
      postgresVersion: 1800
      timescaledb: true
    isDefault: true
    editable: true
